[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "biocma"
dynamic = ["version"]
description = "I/O and utilities for the Consensus Multiple Alignment (CMA) file format."
readme = "README.rst"
requires-python = ">=3.12"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [
    {name = "Eric Talevich", email = "me+code@etal.mozmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "biopython>=1.86",
]

[project.scripts]
cma-blocks = "biocma.cli:blocks_main"
cma-convert = "biocma.cli:convert_main"
cma-dedupe = "biocma.cli:dedupe_main"
cma-tweak = "biocma.cli:tweak_main"

[project.urls]
homepage = "https://github.com/etal/biocma"
repository = "https://github.com/etal/biocma"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.17.2",
]

[tool.setuptools]
packages = ["biocma"]

[tool.setuptools.dynamic]
version = {attr = "biocma.__version__"}

[tool.pytest.ini_options]
minversion = "9.0.2"
testpaths = ["test"]
pythonpath = ["."]
filterwarnings = ["error"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "LOG", "G"]

[tool.mypy]
files = ["biocma"]
# The analysis target, set explicitly rather than taken from the interpreter
# running mypy. Raise it if a dependency's stubs need newer syntax; it need
# not match requires-python, which the test matrix covers.
python_version = "3.12"
check_untyped_defs = true

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

# Version constraints live in [project] and [dependency-groups]; pixi derives
# the "dev" feature from the dependency group, and these entries only make it
# take the packages from conda-forge rather than PyPI.
[tool.pixi.dependencies]
biopython = "*"

[tool.pixi.feature.dev.dependencies]
mypy = "*"
pytest = "*"
ruff = "*"

# The oldest supported Python; keep in step with requires-python.
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.pypi-dependencies]
biocma = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["dev"] }
py312 = { features = ["dev", "py312"] }

[tool.pixi.tasks]
test = "pytest"
lint = "ruff check"
fmt = "ruff format"
typecheck = "mypy"
